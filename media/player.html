<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Zhou Audio Player</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      // Apply saved theme before page renders
      const saved = localStorage.getItem("theme");
      if (saved === "light") {
        document.documentElement.setAttribute("class", "");
      } else {
        document.documentElement.setAttribute("class", "dark");
      }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />

    <style>
      :root {
  --nexus-bg: #101218;
}

html:not(.dark) {
  --nexus-bg: #f7f9fb;
}
.material-symbols-outlined {
  font-variation-settings:
    "FILL" 0,
    "wght" 400,
    "GRAD" 0,
    "opsz" 24;
}

body {
  font-family: "Atkinson Hyperlegible Next", sans-serif;
  -webkit-font-smoothing: antialiased;
}
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      /* .radial-blur {
        background: radial-gradient(
          circle at 50% 50%,
          rgba(184, 195, 255, 0.08) 0%,
          rgba(247, 249, 251, 0) 70%
        );
      } */
      .player-container {
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }
      body {
  background:
    radial-gradient(
      circle at top left,
      rgba(184, 195, 255, 0.08),
      transparent 28%
    ),
    radial-gradient(
      circle at bottom right,
      rgba(184, 195, 255, 0.04),
      transparent 24%
    ),
    var(--nexus-bg);
  color: #f3f4f6;
  position: relative;
  overflow-x: hidden;
}
.sidebar {
  background: none !important;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    circle at 50% 0%,
    rgba(255, 255, 255, 0.04),
    transparent 38%
  );
  opacity: 0.25;
  z-index: 0;
}

body > * {
  position: relative;
  z-index: 1;
}
      .album-art-shadow {
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      }
      .top-header {
        background: transparent;
        border-bottom: none;
        padding: 18px 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        position: fixed;
        top: 0;
        left: 256px;
        right: 0;
        z-index: 40;
        backdrop-filter: none;
      }

      input[type=range]#volume-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 96px;
  height: 4px;
  border-radius: 9999px;
  background: linear-gradient(
    to right,
    #b8c3ff var(--val, 75%),
    #2a3242 var(--val, 75%)
  );
  outline: none;
  cursor: pointer;
}
input[type=range]#volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #b8c3ff;
  border: 2px solid #000000;
  box-shadow: 0 0 0 1.5px #b8c3ff;
  transition: transform 0.15s;
}
input[type=range]#volume-slider::-moz-range-thumb {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #b8c3ff;
  border: 2px solid #000000;
  box-shadow: 0 0 0 1.5px #b8c3ff;
  transition: transform 0.15s;
}
input[type=range]#volume-slider:hover::-webkit-slider-thumb,
input[type=range]#volume-slider:hover::-moz-range-thumb {
  transform: scale(1.25);
}

      /* Light Mode Theme */
      html:not(.dark) body {
        background: #f7f9fb;
      }

      html:not(.dark) input[type=range]#volume-slider {
        background: linear-gradient(
          to right,
          #131b2e var(--val, 75%),
          #e6e8ea var(--val, 75%)
        );
      }

      html:not(.dark) input[type=range]#volume-slider::-webkit-slider-thumb {
        background: #131b2e;
        border: 2px solid #f7f9fb;
        box-shadow: 0 0 0 1.5px #131b2e;
      }

      html:not(.dark) input[type=range]#volume-slider::-moz-range-thumb {
        background: #131b2e;
        border: 2px solid #f7f9fb;
        box-shadow: 0 0 0 1.5px #131b2e;
      }

      html:not(.dark) input[type="range"] {
        background: linear-gradient(
          to right,
          #131b2e var(--val, 75%),
          #e6e8ea var(--val, 75%)
        ) !important;
      }

      html:not(.dark) #song-slider {
        accent-color: #131b2e;
      }

      html:not(.dark) #volume-slider {
        accent-color: #131b2e;
      }

     
    </style>
    <script id="tailwind-config">

        darkMode: "class",

              "on-primary-fixed": "#131b2e",

              "surface-dim": "#d8dadc",
              "on-secondary": "#000000",
              "surface-tint": "#b8c3ff",
              "error-container": "#5d1f1f",
              "on-secondary-container": "#f3f4f6",
              "surface-variant": "#151922",
              "on-primary": "#000000",
              "primary-fixed": "#b8c3ff",
              "surface-bright": "#0f1115",
              "surface-container": "#151922",
              "primary-container": "#b8c3ff",
              "on-surface-variant": "#aab2c5",
              "on-secondary-fixed": "#000000",
              tertiary: "#b8c3ff",
              "on-tertiary-fixed": "#000000",
              "on-secondary-fixed-variant": "#000000",
              "on-background": "#f3f4f6",
              "on-error": "#000000",
              "on-primary-container": "#000000",
              "outline-variant": "#2a3242",
              "secondary-container": "#1b2233",
              "on-error-container": "#f3f4f6",
              "surface-container-lowest": "#000000",
              "tertiary-fixed": "#b8c3ff",
              secondary: "#aab2c5",
              surface: "#0f1115",
              "on-tertiary-container": "#000000",
              background: "#000000",
              "inverse-primary": "#000000",
              "secondary-fixed": "#1b2233",
              "on-surface": "#f3f4f6",
              "on-primary-fixed-variant": "#000000",
              "surface-container-highest": "#1c2230",
              "inverse-on-surface": "#000000",
              "on-tertiary": "#000000",
              "surface-container-low": "#0f1115",
              "inverse-surface": "#f3f4f6",
              "surface-container-high": "#151922",
              outline: "#2a3242",
              "primary-fixed-dim": "#1b2233",

            borderRadius: {

            spacing: {
              "touch-target-min": "48px",

              base: "8px",
            },
            fontFamily: {
              display: ["Atkinson Hyperlegible Next", "sans-serif"],
              h1: ["Atkinson Hyperlegible Next", "sans-serif"],
              h2: ["Atkinson Hyperlegible Next", "sans-serif"],
              "body-lg": ["Atkinson Hyperlegible Next", "sans-serif"],
              "body-md": ["Atkinson Hyperlegible Next", "sans-serif"],
              "label-caps": ["Atkinson Hyperlegible Next", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="text-on-surface font-body-md selection:bg-primary selection:text-primary-container min-h-screen radial-blur"
  >
    <!-- Main Nexus Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-branding">
        <h1>MAIN TERMINAL</h1>
        <p>v0.1.0 Active</p>
      </div>
      <div class="sidebar-nav site-nav">
        <a href="../main/index.html" class="site-nav-link">
          <span class="material-symbols-outlined">dashboard</span>
          <span>Dashboard</span>
        </a>
        <a href="../planning/index.html" class="site-nav-link">
          <span class="material-symbols-outlined">calendar_today</span>
          <span>Agenda</span>
        </a>
        <a
          href="../media/player.html"
          class="site-nav-link active"
          aria-current="page"
        >
          <span class="material-symbols-outlined">play_circle</span>
          <span>Media</span>
        </a>
      </div>
        <a href="../profile/settings.html" class="profile-link">
      <div class="sidebar-profile" style="margin-top: 14px">
        <div class="profile-avatar">
          <img id="sidebarAvatar" src="../media/css/audio/cover/nevermind-nirvana-album-cover.jpg" alt="temp" />
        </div>
        <div class="profile-info">
          <span class="profile-name" id="sidebarName">user</span>
        </div>
      </div>
    </nav>
    </a>

    <!-- Top Navigation Bar -->
    <header class="top-header">
      <div class="hidden md:flex items-center gap-8">
        <a
          class="text-on-surface-variant hover:text-primary transition-colors px-2 py-1"
          href=""
          >Movies</a
        >
        <a
          class="text-on-surface-variant hover:text-primary transition-colors px-2 py-1"
          href="#"
          >TV Shows</a
        >
        <a
          class="text-primary font-bold border-b-2 border-primary px-2 py-1"
          href="#"
          >Audio</a
        >
        <a
          class="text-on-surface-variant hover:text-primary transition-colors px-2 py-1"
          href="./discovery/discovery.html"
          >Discovery</a
        >
      </div>
    </header>

    <!-- Main Content Area: Zhou Audio Player Experience -->
    <main
      class="ml-64 pt-28 pb-24 min-h-screen px-container-padding flex flex-col items-center justify-center"
    >
      <div class="player-container flex flex-col items-center space-y-12">
        <!-- Large Album Art Section -->
         <a href="./discovery/discovery.html">
        <div
          class="relative w-full aspect-square max-w-[400px] rounded-[32px] overflow-hidden album-art-shadow group"
        >
          
            <img
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              id="song-image"
              src=""
            />
          <div
            class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm"
          >
           </a>
            <span
              class="material-symbols-outlined text-white text-6xl opacity-80"
              >graphic_eq</span
            >
          </div>
        </div>
        <!-- Track Info -->
        <div class="text-center space-y-2">
          <h2
            class="text-4xl font-bold tracking-tight text-on-surface"
            id="song-name"
          >
            Midnight Resonance
          </h2>
          <p class="text-xl text-primary font-medium" id="song-artist">
            Aether Velocity
          </p>
        </div>
        <!-- Custom Seek Bar -->
        <div class="w-full space-y-2">
          <div
            class="flex justify-between text-xs font-bold text-on-surface-variant uppercase tracking-widest"
          >
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
          </div>
          <input
            type="range"
            min="0"
            max="100"
            value="0"
            id="song-slider"
            class="w-full h-1.5 bg-surface-container rounded-full cursor-pointer appearance-none"
            style="accent-color: #b8c3ff"
          />
        </div>
        <!-- Playback Controls -->
        <div class="flex items-center justify-between w-full max-w-sm">
          <button
            class="text-on-surface-variant hover:text-primary transition-colors"
            id="shuffle-song"
          >
            <span class="material-symbols-outlined text-3xl">shuffle</span>
          </button>
          <button
            class="text-on-surface hover:text-primary transition-colors"
            id="prev-button"
          >
            <span class="material-symbols-outlined text-4xl"
              >skip_previous</span
            >
          </button>
          <button
            class="w-20 h-20 bg-primary  rounded-full flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all"
            id="playpause-button"
          >
            <span
              class="material-symbols-outlined text-5xl"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >pause</span
            >
          </button>
          <button
            class="text-on-surface hover:text-primary transition-colors"
            id="next-button"
          >
            <span class="material-symbols-outlined text-4xl">skip_next</span>
          </button>
          <button
            class="text-on-surface-variant hover:text-primary transition-colors"
            id="repeat-song"
          >
            <span class="material-symbols-outlined text-3xl">repeat</span>
          </button>
        </div>
        <!-- Secondary Controls -->
        <div class="flex items-center gap-8 text-on-surface-variant">
          <div
            class="flex items-center gap-3 bg-surface-container-low px-4 py-2 rounded-full border border-outline-variant"
          >
            <span class="material-symbols-outlined text-xl">volume_up</span>
                <input type="range" min="0" max="100" value="75" class="w-full h-full appearance-none cursor-pointer" style="accent-color: #0b30ff" id="volume-slider" />
          </div>
          <button class="hover:text-primary transition-colors">
            <span class="material-symbols-outlined">favorite</span>
          </button>
          <button class="hover:text-primary transition-colors" id="queue-button">
            <span class="material-symbols-outlined">queue_music</span>
          </button>
          <button class="hover:text-primary transition-colors" id="share-button">
            <span class="material-symbols-outlined">share</span>
          </button>
        </div>
        <div id="album-playlist" class="w-full max-w-[800px] mt-8 hidden">
          <h3 id="album-title" class="text-2xl font-semibold mb-2"></h3>
          <ul id="album-songs" class="space-y-2"></ul>
        </div>
      </div>
    </main>
  </body>
 <script src="./js/sidebar.js"></script>
  <script src="./js/player.js"></script>
</html>
