      const saved = localStorage.getItem("theme");

        document.documentElement.setAttribute("class", "");
      } else {
        document.documentElement.setAttribute("class", "dark");
      }

  <body
    class="text-on-surface font-body-md selection:bg-primary selection:text-primary-container min-h-screen radial-blur"
  >
    <!-- Main Nexus Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-branding">
        <h1>MAIN TERMINAL</h1>
        <p>v0.1.0 Active</p>
      </div>
      <div class="sidebar-nav site-nav">
        <a href="../main/index.html" class="site-nav-link">
          <span class="material-symbols-outlined">dashboard</span>
          <span>Dashboard</span>
        </a>
        <a href="../planning/index.html" class="site-nav-link">
          <span class="material-symbols-outlined">calendar_today</span>
          <span>Agenda</span>
        </a>
        <a
          href="../media/player.html"
          class="site-nav-link active"
          aria-current="page"
        >
          <span class="material-symbols-outlined">play_circle</span>
          <span>Media</span>
        </a>
      </div>
        <a href="../profile/settings.html" class="profile-link">
      <div class="sidebar-profile" style="margin-top: 14px">
        <div class="profile-avatar">
          <img id="sidebarAvatar" src="../media/css/audio/cover/nevermind-nirvana-album-cover.jpg" alt="temp" />
        </div>
        <div class="profile-info">
          <span class="profile-name" id="sidebarName">user</span>
        </div>
      </div>

    </a>

    <!-- Top Navigation Bar -->
    <header class="top-header">
      <div class="hidden md:flex items-center gap-8">
        <a
          class="text-on-surface-variant hover:text-primary transition-colors px-2 py-1"
          href=""
          >Movies</a
        >
        <a
          class="text-on-surface-variant hover:text-primary transition-colors px-2 py-1"
          href="#"
          >TV Shows</a
        >
        <a
          class="text-primary font-bold border-b-2 border-primary px-2 py-1"
          href="#"
          >Audio</a
        >
        <a
          class="text-on-surface-variant hover:text-primary transition-colors px-2 py-1"
          href="./discovery/discovery.html"
          >Discovery</a
        >
      </div>
    </header>

    <!-- Main Content Area: Zhou Audio Player Experience -->
    <main
      class="ml-64 pt-28 pb-24 min-h-screen px-container-padding flex flex-col items-center justify-center"
    >
      <div class="player-container flex flex-col items-center space-y-12">
        <!-- Large Album Art Section -->
         <a href="./discovery/discovery.html">
        <div
          class="relative w-full aspect-square max-w-[400px] rounded-[32px] overflow-hidden album-art-shadow group"
        >
          
            <img
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              id="song-image"
              src=""
            />
          <div
            class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm"
          >
           </a>
            <span
              class="material-symbols-outlined text-white text-6xl opacity-80"
              >graphic_eq</span
            >
          </div>
        </div>
        <!-- Track Info -->
        <div class="text-center space-y-2">
          <h2
            class="text-4xl font-bold tracking-tight"
            id="song-name"
          >
            
          </h2>
          <p class="text-xl text-primary font-medium" id="song-artist">
          
          </p>
        </div>
        <!-- Custom Seek Bar -->
        <div class="w-full space-y-2">
          <div
            class="flex justify-between text-xs font-bold text-on-surface-variant uppercase tracking-widest"
          >
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
          </div>
          <input
            type="range"
            min="0"
            max="100"
            value="0"
            id="song-slider"
            class="w-full h-1.5 rounded-full cursor-pointer appearance-none"
            style="accent-color: #b8c3ff"
          />
        </div>
        <!-- Playback Controls -->
        <div class="flex items-center justify-between w-full max-w-sm">
          <button
            class="text-on-surface-variant hover:text-primary transition-colors"
            id="shuffle-song"
          >
            <span class="material-symbols-outlined text-3xl">shuffle</span>
          </button>
          <button
            class="text-on-surface hover:text-primary transition-colors"
            id="prev-button"
          >
            <span class="material-symbols-outlined text-4xl"
              >skip_previous</span
            >
          </button>
          <button
            class="w-20 h-20 bg-primary  rounded-full flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all"
            id="playpause-button"
          >
            <span
              class="material-symbols-outlined text-5xl"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >pause</span
            >
          </button>
          <button
            class="text-on-surface hover:text-primary transition-colors"
            id="next-button"
          >
            <span class="material-symbols-outlined text-4xl">skip_next</span>
          </button>
          <button
            class="text-on-surface-variant hover:text-primary transition-colors"
            id="repeat-song"
          >
            <span class="material-symbols-outlined text-3xl">repeat</span>
          </button>
        </div>
        <!-- Secondary Controls -->
        <div class="flex items-center gap-8 text-on-surface-variant">
          <div
            class="flex items-center gap-3 px-4 py-2 rounded-full border border-outline-variant"
          >
            <span class="material-symbols-outlined text-xl">volume_up</span>
                <input type="range" min="0" max="100" value="75" class="w-full h-full appearance-none cursor-pointer" style="accent-color: #0b30ff" id="volume-slider" />
          </div>
          <button class="hover:text-primary transition-colors">
            <span class="material-symbols-outlined">favorite</span>
          </button>
          <button class="hover:text-primary transition-colors" id="queue-button">
            <span class="material-symbols-outlined">queue_music</span>
          </button>
          <button class="hover:text-primary transition-colors" id="share-button">
            <span class="material-symbols-outlined">share</span>
          </button>
        </div>
        <div id="album-playlist" class="w-full max-w-[800px] mt-8 hidden">
          <h3 id="album-title" class="text-2xl font-semibold mb-2"></h3>
          <ul id="album-songs" class="space-y-2"></ul>
        </div>
      </div>
    </main>
  </body>
